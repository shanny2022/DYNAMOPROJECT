artifacts = ["/app/output/features.csv", "/app/output/validation.json"]

[task]
name = "dynamo/customer-time-features"
description = "Build and validate point-in-time customer features from versioned source data."

[metadata]
# --- Pre-seeded for you when this repo was created — DO NOT EDIT ---
category = "Data Processing and ETL"                      # diversity category, assigned to your task by the Dynamo team
subcategory = "ETL Pipelines"                   # diversity subcategory, assigned by the Dynamo team
# --- Fixed for this dataset — LEAVE AS-IS ---
model_tested = "Opus-4.8"           # difficulty-benchmarking model (do not change)
agent_tested = "Terminus-2"        # difficulty-benchmarking agent (do not change)
# --- You fill these in ---
# task_objective / artifact_type: pick from .dynamo/diversity-taxonomy.toml (lowercase snake_case).
task_objective = ["transform", "validate", "generate"]
artifact_type = ["dataset_or_tabular_file", "generated_output_artifact"]
expert_time_estimate_hours = 3
difficulty_explanation = "The source data contains late-arriving event corrections whose ingested_at timestamps exceed the cutoff — engineers must apply point-in-time ingestion filtering (ingested_at <= cutoff) after global deduplication to prevent feature leakage. Additional traps include lexicographic record-ID tie-breaks with non-padded IDs (for customer/event/status/label winners), UTC-offset timestamps, blank IDs that normalize to null, non-numeric purchase amounts, preserved zero-event rows, and strict exclusive lower bounds on rolling windows."
solution_explanation = "Normalize keys and timestamps, resolve source versions deterministically, build the eligible customer-cutoff population, reconstruct as-of facts, aggregate events, join labels, and emit stable artifacts."
verification_explanation = "Pytest independently rebuilds the expected dataset from seed inputs and checks schema, keys, ordering, feature groups, edge cases, and every validation count."

[verifier]
timeout_sec = 120.0                # increase based on your test suite's runtime demands
# Canonical TB2: the verifier runs in the environment image (no separate tests/Dockerfile).
# Harbor overlays tests/ at verify time; leave environment_mode unset for this shared model.

[agent]
timeout_sec = 2400.0

[environment]
build_timeout_sec = 600.0          # max seconds for the Docker build
cpus = 1                           # increase for parallel/compute-heavy workloads
memory_mb = 2048                   # increase for large datasets or in-memory processing
storage_mb = 10240                 # increase for tasks with large files or build artifacts
gpus = 0                           # max 1, expect H100
allow_internet = true              # open internet is available to the agent
mcp_servers = []                   # optional MCP servers to expose to the agent
